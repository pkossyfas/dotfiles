add_newline = false

format = """
$username\
$hostname\
$directory\
$gcloud\
$kubernetes\
$golang\
$terraform\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$sudo\
$cmd_duration\
$jobs\
$battery\
$time\
$status\
$os\
$container\
$shell\
$character"""
command_timeout = 2000

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'

[username]
disabled = false
style_user = 'bold green'
style_root = 'black bold'
format = '[pol ](bold green)'
show_always = true

[kubernetes]
disabled = true
#⎈ 󰠳 ﴱ
symbol = "󰠳"
#format = '[[$symbol](blue) [$context](dimmed purple):[$namespace](green)](cyan) '
#format = '[\[[$symbol](blue) [$context](dimmed purple):[$namespace](green)\]](cyan) '
format = '[\([$symbol](blue) [$context](dimmed purple):[$namespace](green)\)](cyan) '

[[kubernetes.contexts]]
# Using capture groups
# Contexts from GKE, AWS and other cloud providers usually carry additional information, like the region/zone.
# The following entry matches on the GKE format (`gke_projectname_zone_cluster-name`)
# and renames every matching kube context into a more readable format (`gke-cluster-name`):
context_pattern = "gke_.*_(?P<cluster>[\\w-]+)"
context_alias = "gke-$cluster"

[directory]
style = 'bold blue'
format = '[ $path]($style)[$read_only]($read_only_style) '
read_only = " "

[git_branch]
# 
symbol = " "
style = 'red'
format = '[$symbol[$branch](red)(:$remote_branch)]($style) '

[git_metrics]
disabled = true
added_style = 'bold blue'
format = '[+$added]($added_style)/[-$deleted]($deleted_style) '

[git_status]
disabled = false
style = "bg:#394260"
ahead = '[⇡${count}](fg:#EEEDE7)'
behind = '[⇣${count}](fg:#EEEDE7)'
diverged = '[⇡${ahead_count}⇣${behind_count}](fg:#EEEDE7)'
modified = '[ ${count}](blue)'
staged = '[●${count}](yellow)'
stashed = '[⚑${count}](bold purple)'
deleted = '[✖ ${count}](fg:#FF5C5C)'
conflicted = '[✖-${count}](fg:#BF2A2E)'
untracked = '[..${count}](cyan)'
format = '[[($all_status$ahead_behind )](fg:#769ff0)]($style)'

[golang]
disabled = true
symbol = ""
format = '[$symbol $version](bold cyan) '

[terraform]
symbol = "󱁢"
format = '[$symbol $version]($style) '

[gcloud]
disabled = true
format = 'on [$symbol$project]($style) '
symbol = '️󱇶 '

[memory_usage]
symbol = " "

[os.symbols]
Alpine = " "
Amazon = " "
Android = " "
Arch = " "
CentOS = " "
Debian = " "
Fedora = " "
FreeBSD = " "
Gentoo = " "
Linux = " "
Macos = " "
Manjaro = " "
Mint = " "
openSUSE = " "
OracleLinux = " "
Pop = " "
Raspbian = " "
Redhat = " "
SUSE = " "
Ubuntu = " "
Unknown = " "
Windows = " "

[package]
symbol = " "

[python]
symbol = " "

[rlang]
symbol = "ﳒ "

[ruby]
symbol = " "

[rust]
symbol = " "

[scala]
symbol = " "
